[build]
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://wadi1111-blockchain-auth-backend.hf.space/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/socket.io/*"
  to = "https://wadi1111-blockchain-auth-backend.hf.space/socket.io/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "publickey-credentials-get=*"
    Content-Security-Policy = "default-src 'self' https://wadi1111-blockchain-auth-backend.hf.space wss://wadi1111-blockchain-auth-backend.hf.space; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://wadi1111-blockchain-auth-backend.hf.space wss://wadi1111-blockchain-auth-backend.hf.space"
